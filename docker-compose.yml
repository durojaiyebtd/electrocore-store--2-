# Local MongoDB as a single-node replica set (Prisma requires a replica set).
# Start:  docker compose up -d
# Stop:   docker compose down
# Use in .env:  DATABASE_URL="mongodb://localhost:27017/electrocore?replicaSet=rs0&directConnection=true"
services:
  mongo:
    image: mongo:7
    container_name: electrocore-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - electrocore-mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot, then reports healthy.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 15s
      start_period: 10s
      retries: 20
    restart: unless-stopped

volumes:
  electrocore-mongo-data:
